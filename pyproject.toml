[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vrpn-mqtt-bridge"
version = "0.1.0"
description = "Bridge VRPN tracker poses to MQTT topics."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "VRPN MQTT Bridge Maintainers"}
]
keywords = ["vrpn", "mqtt", "motion-capture", "robotics", "pose"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "paho-mqtt>=1.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.scripts]
vrpn-mqtt-bridge = "vrpn_mqtt_bridge.cli:main"
vrpn-to-mqtt = "vrpn_mqtt_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
